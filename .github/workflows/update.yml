name: Update Surge domain sets

on:
  schedule:
    - cron: '27 2 * * 1' # Weekly Monday 02:27 UTC (10:27 Beijing)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'convert.py'
      - 'test_convert.py'
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  group: update-domain-sets
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest -v
      - name: Download, validate, and convert both upstreams
        run: python convert.py --download
      - name: Publish only changed outputs
        run: |
          git add -- domains
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update Surge domain sets'
          git push
